###############################################################################
# Global Options

[mypy]
files = smqtk_iqr, tests

# Disable caching
incremental = False

# Disallows defining functions without type annotations or with incomplete type
# annotations.
disallow_untyped_defs = True


###############################################################################
# Options for different parts of SMQTK-IQR

;[mypy-smqtk_iqr.*]

[mypy-tests.*]
# Test fixtures intentionally provide empty implementations replaced by mocks.
disable_error_code = empty-body

###############################################################################
# TPL-module options

[mypy-numpy.*]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = True

[mypy-pytest]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = True

[mypy-pymongo.*]
ignore_missing_imports = True

[mypy-flask_cors.*]
ignore_missing_imports = True

[mypy-flask_basicauth.*]
ignore_missing_imports = True
