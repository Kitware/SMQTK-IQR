# This is a basic workflow to help you get started with Actions

name: CI Unittests

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - release*
  schedule:
    # Nightly run unit tests to check for implicit dependency issues between pull requests.
    - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# NOTE: Github actions does not support anchors apparently. Forgive duplication of job
#       steps.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Cache local python environment artifacts for the current python version
      # and poetry lockfile hash.
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Setup Environment
        # See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#example-using-a-public-action-in-a-subdirectory
        uses: Kitware/SMQTK-Core/.github/actions/python-poetry-setup@master
      - name: Lint with Flake8
        run: poetry run flake8

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Cache local python environment artifacts for the current python version
      # and poetry lockfile hash.
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Setup Environment
        # See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#example-using-a-public-action-in-a-subdirectory
        uses: Kitware/SMQTK-Core/.github/actions/python-poetry-setup@master
      - name: Typecheck with MyPy
        run: poetry run mypy

  unittests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Extras for included, optional plugin support (space-separated lists)
        opt-extra: [
            "",  # no extras
        ]
      # We want all python versions tested even if one of them happens to fail
      fail-fast: false


    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      # Cache local python environment artifacts for the current python version
      # and poetry lockfile hash.
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Setup Environment
        # See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#example-using-a-public-action-in-a-subdirectory
        uses: Kitware/SMQTK-Core/.github/actions/python-poetry-setup@master

      - name: Optionally install additional requirements
        env:
          OPT_EXTRA: ${{ matrix.opt-extra }}
        run: |
          if [[ -n "$OPT_EXTRA" ]]
          then
            poetry install --extras "$OPT_EXTRA"
          fi

      - name: Run Unittests
        run: poetry run pytest

      - name: Save coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: ubuntu-24.04
    needs: unittests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-
      - name: Setup Environment
        uses: Kitware/SMQTK-Core/.github/actions/python-poetry-setup@master
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-python-*
          path: coverage-data
      - name: Check coverage and write reports
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p coverage-reports
          poetry run coverage combine --keep coverage-data/*/.coverage
          poetry run coverage xml -o coverage-reports/coverage.xml
          poetry run coverage xml --include='smqtk_iqr/*' -o coverage-reports/package.xml
          poetry run coverage xml --include='tests/*' -o coverage-reports/tests.xml
          poetry run coverage html -d coverage-reports/html

          status=0
          poetry run coverage report --include='smqtk_iqr/*' --format=markdown \
            --fail-under=55 > coverage-reports/package.md || status=1
          poetry run coverage report --include='tests/*' --format=markdown \
            --fail-under=100 > coverage-reports/tests.md || status=1
          # Release PRs include changes already checked on master.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_BASE_REF" == "master" ]]; then
            poetry run diff-cover coverage-reports/package.xml --compare-branch="origin/$PR_BASE_REF" \
              --fail-under=80 --format=markdown:coverage-reports/package-diff.md || status=1
            poetry run diff-cover coverage-reports/tests.xml --compare-branch="origin/$PR_BASE_REF" \
              --fail-under=100 --format=markdown:coverage-reports/tests-diff.md || status=1
          fi

          {
            echo '## Package coverage (minimum 55%)'
            cat coverage-reports/package.md
            echo
            echo '## Test coverage (minimum 100%)'
            cat coverage-reports/tests.md
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_BASE_REF" == "master" ]]; then
              echo
              echo '## Changed package lines (minimum 80%)'
              cat coverage-reports/package-diff.md
              echo
              echo '## Changed test lines (minimum 100%)'
              cat coverage-reports/tests-diff.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Save coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-reports/
          if-no-files-found: error
          retention-days: 7
